          title: "Balance that makes sense"
          body: "See what is left after rent, bills, and planned savings, not just the number your bank shows today."
        categories:
          title: "Purposeful categories"
          body: "You spent 32% on housing in April. Was that part of the plan, or does next month need an adjustment?"
        goals:
          title: "Visible goals"
          body: "Track how close you are to an emergency fund, a trip, or paying down debt while still seeing this month's pressure."
        budget:
          title: "Practical budgeting"
          body: "If groceries pass the limit halfway through the month, you see it early enough to change the next purchase."
