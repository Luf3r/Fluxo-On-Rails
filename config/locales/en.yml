    title: "Fluxo - personal finance without heavy spreadsheets"
    hero:
      eyebrow: "Personal finance with clarity"
      headline: "Control your money without becoming hostage to spreadsheets."
      body: "Fluxo organizes income, expenses, accounts, goals, and budgets into a simple routine so you understand the month before it ends."
      primary_cta: "Start now"
      secondary_cta: "I already have an account"
      stats:
        first_label: "See"
        first_value: "Your Finances"
        second_label: "Prioritize"
        second_value: "Goals"
        third_label: "Adjust"
        third_value: "Spending"
    mockup:
      projected_balance: "Projected balance"
      projected_balance_value: "$ 8,420"
      housing: "Housing"
      groceries: "Groceries"
      goals: "Goals"
    routine:
      eyebrow: "Routine"
      headline: "One screen for every important decision."
      month_title: "See the month"
      month_body: "Track how much came in, how much went out, and what is still committed before closing the month."
      plan_title: "Plan without friction"
      plan_body: "Separate categories, define budgets, and turn goals into visible savings targets."
    planning:
      eyebrow: "Planning"
      headline: "Move beyond loose records and start making decisions with context."
      items:
        balance:
          title: "Balance that makes sense"
          body: "See what is left after rent, bills, and planned savings, not just the number your bank shows today."
        categories:
          title: "Purposeful categories"
          body: "You spent 32% on housing in April. Was that part of the plan, or does next month need an adjustment?"
        goals:
          title: "Visible goals"
          body: "Track how close you are to an emergency fund, a trip, or paying down debt while still seeing this month's pressure."
        budget:
          title: "Practical budgeting"
          body: "If groceries pass the limit halfway through the month, you see it early enough to change the next purchase."
    close:
      eyebrow: "Less anxiety, more direction"
      headline: "Fluxo is designed for people who want to stop discovering too late where the money went."
      body: "The product puts planning at the center: income, expenses, goals, and priorities appear together to turn financial tracking into a habit."
      cta: "Create my account"
  auth:
    locales:
      en: "English"
      pt_BR: "Portuguese"
    mailer:
      confirmation:
        greeting: "Welcome, %{name}"
        body: "You can confirm your Fluxo account email through the link below:"
        cta: "Confirm my account"
